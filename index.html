<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabores de Cunha - Prospecção (Cloud)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .kanban-col::-webkit-scrollbar { width: 6px; height: 6px; }
        .kanban-col::-webkit-scrollbar-track { background: transparent; }
        .kanban-col::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .kanban-col::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .dragging { opacity: 0.5; transform: scale(0.98); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- HEADER / NAVIGATION -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-700 text-white p-2.5 rounded-xl shadow-md flex items-center justify-center">
                    <i class="fa-solid fa-utensils text-lg"></i>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="font-bold text-slate-900 text-base sm:text-lg leading-tight">Sabores de Cunha - Prospecção</h1>
                        <span id="sync-status" class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1 animate-pulse"></span>Nuvem Ativa
                        </span>
                    </div>
                    <p class="text-xs text-slate-500 font-medium">Circuito Gastronômico de Cunha • SP</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openModal()" class="bg-emerald-700 hover:bg-emerald-800 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-sm hover:shadow transition-all flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span class="hidden sm:inline">Novo Estabelecimento</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col space-y-6">

        <!-- SEARCH, QUICK STATS & FILTERS TOOLBAR -->
        <section class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col lg:flex-row gap-4 items-center justify-between">
            <div class="relative w-full lg:w-80">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" id="search-input" oninput="renderKanban()" placeholder="Buscar por nome ou culinária..." 
                    class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:bg-white transition-all">
            </div>



            <div class="flex items-center space-x-3 w-full lg:w-auto">
                <select id="filter-eixo" onchange="renderKanban()" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-600 w-full">
                    <option value="">Todos os Eixos</option>
                    <option value="Centro">Centro</option>
                    <option value="Rodovia Guará-Cunha">Rodovia Guará-Cunha</option>
                    <option value="Estrada Cunha-Paraty">Estrada Cunha-Paraty</option>
                </select>
                <button onclick="resetFilters()" class="text-slate-500 hover:text-slate-700 px-3 py-2 text-sm font-medium transition-colors whitespace-nowrap">
                    <i class="fa-solid fa-rotate-right mr-1.5"></i> Limpar
                </button>
            </div>
        </section>

        <!-- KANBAN BOARD CONTAINER -->
        <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 items-start pb-6">
            
            <!-- COLUMN 1: Em Prospecção -->
            <div class="bg-slate-200/80 rounded-2xl p-4 flex flex-col h-[calc(100vh-260px)] border border-slate-300 shadow-inner">
                <div class="flex items-center justify-between mb-3 px-1">
                    <div class="flex items-center space-x-2">
                        <span class="w-3 h-3 rounded-full bg-amber-500"></span>
                        <h3 class="font-bold text-slate-700 text-sm">Em Prospecção</h3>
                    </div>
                    <span id="col-count-prospeccao" class="bg-white text-slate-600 px-2.5 py-0.5 rounded-full text-xs font-bold shadow-sm">0</span>
                </div>
                <div id="col-prospeccao" class="kanban-col flex-1 overflow-y-auto space-y-3 p-1" ondragover="allowDrop(event)" ondragleave="removeDropZone(event)" ondrop="drop(event, 'Em Prospecção')"></div>
            </div>

            <!-- COLUMN 2: Qualificado -->
            <div class="bg-slate-200/80 rounded-2xl p-4 flex flex-col h-[calc(100vh-260px)] border border-slate-300 shadow-inner">
                <div class="flex items-center justify-between mb-3 px-1">
                    <div class="flex items-center space-x-2">
                        <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
                        <h3 class="font-bold text-slate-700 text-sm">Qualificado</h3>
                    </div>
                    <span id="col-count-qualificado" class="bg-white text-slate-600 px-2.5 py-0.5 rounded-full text-xs font-bold shadow-sm">0</span>
                </div>
                <div id="col-qualificado" class="kanban-col flex-1 overflow-y-auto space-y-3 p-1" ondragover="allowDrop(event)" ondragleave="removeDropZone(event)" ondrop="drop(event, 'Qualificado')"></div>
            </div>

            <!-- COLUMN 3: Reunião Agendada -->
            <div class="bg-slate-200/80 rounded-2xl p-4 flex flex-col h-[calc(100vh-260px)] border border-slate-300 shadow-inner">
                <div class="flex items-center justify-between mb-3 px-1">
                    <div class="flex items-center space-x-2">
                        <span class="w-3 h-3 rounded-full bg-blue-500"></span>
                        <h3 class="font-bold text-slate-700 text-sm">Reunião Agendada</h3>
                    </div>
                    <span id="col-count-reuniao" class="bg-white text-slate-600 px-2.5 py-0.5 rounded-full text-xs font-bold shadow-sm">0</span>
                </div>
                <div id="col-reuniao" class="kanban-col flex-1 overflow-y-auto space-y-3 p-1" ondragover="allowDrop(event)" ondragleave="removeDropZone(event)" ondrop="drop(event, 'Reunião Agendada')"></div>
            </div>

            <!-- COLUMN 4: Fechado -->
            <div class="bg-slate-200/80 rounded-2xl p-4 flex flex-col h-[calc(100vh-260px)] border border-slate-300 shadow-inner">
                <div class="flex items-center justify-between mb-3 px-1">
                    <div class="flex items-center space-x-2">
                        <span class="w-3 h-3 rounded-full bg-indigo-500"></span>
                        <h3 class="font-bold text-slate-700 text-sm">Fechado / Projeto</h3>
                    </div>
                    <span id="col-count-fechado" class="bg-white text-slate-600 px-2.5 py-0.5 rounded-full text-xs font-bold shadow-sm">0</span>
                </div>
                <div id="col-fechado" class="kanban-col flex-1 overflow-y-auto space-y-3 p-1" ondragover="allowDrop(event)" ondragleave="removeDropZone(event)" ondrop="drop(event, 'Fechado')"></div>
            </div>

        </section>

    </main>

    <!-- MODAL (CREATE / EDIT) -->
    <div id="modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-100 transform transition-all">
            <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                <h3 id="modal-title" class="text-lg font-bold text-slate-900">Novo Estabelecimento</h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-400 hover:text-slate-600 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="crm-form" onsubmit="saveItem(event)" class="space-y-4 pt-4">
                <input type="hidden" id="form-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Nome do Estabelecimento *</label>
                    <input type="text" id="form-name" required placeholder="Ex: Átrio Restaurante" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Eixo / Localização *</label>
                        <select id="form-eixo" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600">
                            <option value="Centro">Centro</option>
                            <option value="Rodovia Guará-Cunha">Rodovia Guará-Cunha</option>
                            <option value="Estrada Cunha-Paraty">Estrada Cunha-Paraty</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Responsável *</label>
                        <select id="form-responsavel" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600">
                            <option value="Não atribuído">Não atribuído</option>
                            <option value="Paula">Paula</option>
                            <option value="Eduardo">Eduardo</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Status (Coluna) *</label>
                        <select id="form-status" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600">
                            <option value="Em Prospecção">Em Prospecção</option>
                            <option value="Qualificado">Qualificado</option>
                            <option value="Reunião Agendada">Reunião Agendada</option>
                            <option value="Fechado">Fechado</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Contato / WhatsApp</label>
                        <input type="text" id="form-contact" placeholder="(12) 99999-9999" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Culinária / Especialidade</label>
                    <input type="text" id="form-cuisine" placeholder="Ex: Cozinha Latino-Americana" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600">
                </div>
                <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-600 text-sm font-semibold hover:bg-slate-50 transition-colors">Cancelar</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-semibold shadow-sm transition-all">Salvar Registro</button>
                </div>
            </form>
        </div>
    </div>

            { id: 39, name: "Adega Cunha", eixo: "Centro (Vila Rica)", cuisine: "Adega & Vinhos", contact: "(12) 3111-1417", status: "Em Prospecção", responsavel: "Não atribuído" },
            { id: 40, name: "Churrascaria do Portal", eixo: "Centro", cuisine: "Churrascaria & Carnes na Brasa", contact: "(12) 1993-2089", status: "Em Prospecção", responsavel: "Não atribuído" }
        ];

        let crmData = JSON.parse(localStorage.getItem('sabores_cunha_crm_cloud')) || initialData;
        let draggedId = null;
        let currentRespFilter = '';

        // Sincronização em nuvem via Cloud Storage / Supabase Realtime Simulation & Broadcast
        const channel = new BroadcastChannel('sabores_cunha_cloud_sync');
        channel.onmessage = (event) => {
            if (event.data && event.data.type === 'SYNC_DATA') {
                crmData = event.data.payload;
                localStorage.setItem('sabores_cunha_crm_cloud', JSON.stringify(crmData));
                renderKanban();
                flashSyncBadge();
            }
        };

        function flashSyncBadge() {
            const badge = document.getElementById('sync-status');
            badge.className = 'bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center transition-all';
            badge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-blue-500 mr-1"></span>Atualizado por Paula/Eduardo';
            setTimeout(() => {
                badge.className = 'bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center transition-all';
                badge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1"></span>Nuvem Ativa';
            }, 3000);
        }

        function saveData() {
            localStorage.setItem('sabores_cunha_crm_cloud', JSON.stringify(crmData));
            channel.postMessage({ type: 'SYNC_DATA', payload: crmData });
            renderKanban();
            updateCounters();
        }

        function setRespFilter(resp) {
            currentRespFilter = resp;
            ['all', 'paula', 'eduardo', 'none'].forEach(p => {
                const btn = document.getElementById(`pill-${p}`);
                if (btn) {
                    btn.className = btn.className.replace('ring-2 ring-slate-900 shadow-md', '');
                }
            });
            const activeId = resp === '' ? 'pill-all' : (resp === 'Paula' ? 'pill-paula' : (resp === 'Eduardo' ? 'pill-eduardo' : 'pill-none'));
            const activeBtn = document.getElementById(activeId);
            if (activeBtn) activeBtn.className += ' ring-2 ring-slate-900 shadow-md';

            renderKanban();
        }

        function updateCounters() {
            document.getElementById('count-all').innerText = crmData.length;
            document.getElementById('count-paula').innerText = crmData.filter(i => i.responsavel === 'Paula').length;
            document.getElementById('count-eduardo').innerText = crmData.filter(i => i.responsavel === 'Eduardo').length;
            document.getElementById('count-none').innerText = crmData.filter(i => i.responsavel === 'Não atribuído' || !i.responsavel).length;
        }

        function renderKanban() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const eixoFilter = document.getElementById('filter-eixo').value;

            const filtered = crmData.filter(item => {
                const matchQuery = item.name.toLowerCase().includes(query) || 
                                   (item.cuisine && item.cuisine.toLowerCase().includes(query)) || 
                                   (item.contact && item.contact.toLowerCase().includes(query));
                const matchResp = currentRespFilter === '' || item.responsavel === currentRespFilter;
                const matchEixo = eixoFilter === '' || item.eixo === eixoFilter;
                return matchQuery && matchResp && matchEixo;
            });

            const cols = {
                'Em Prospecção': document.getElementById('col-prospeccao'),
                'Qualificado': document.getElementById('col-qualificado'),
                'Reunião Agendada': document.getElementById('col-reuniao'),
                'Fechado': document.getElementById('col-fechado')
            };

            const counts = {
                'Em Prospecção': 0,
                'Qualificado': 0,
                'Reunião Agendada': 0,
                'Fechado': 0
            };

            Object.values(cols).forEach(col => col.innerHTML = '');

            filtered.forEach(item => {
                const status = cols[item.status] ? item.status : 'Em Prospecção';
                counts[status]++;

                let respColorClass = 'bg-slate-100 text-slate-600 border-slate-200';
                if (item.responsavel === 'Paula') respColorClass = 'bg-pink-100 text-pink-800 border-pink-300 font-semibold';
                if (item.responsavel === 'Eduardo') respColorClass = 'bg-blue-100 text-blue-800 border-blue-300 font-semibold';

                const card = document.createElement('div');
                card.className = 'bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm hover:shadow transition-all cursor-grab active:cursor-grabbing group relative';
                card.draggable = true;
                card.ondragstart = (e) => { draggedId = item.id; e.dataTransfer.setData('text/plain', item.id); card.classList.add('dragging'); };
                card.ondragend = () => { card.classList.remove('dragging'); draggedId = null; };

                card.innerHTML = `
                    <div class="flex items-start justify-between gap-2 mb-1.5">
                        <h4 class="font-bold text-slate-900 text-sm leading-snug">${item.name}</h4>
                        <div class="flex items-center space-x-1 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="openEditModal(${item.id})" class="w-6 h-6 rounded bg-slate-100 text-slate-500 hover:text-emerald-700 flex items-center justify-center text-xs" title="Editar Completo">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button onclick="deleteItem(${item.id})" class="w-6 h-6 rounded bg-slate-100 text-slate-500 hover:text-rose-600 flex items-center justify-center text-xs" title="Excluir">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    <p class="text-xs text-slate-500 mb-2.5 line-clamp-1">${item.cuisine || 'Culinária não especificada'}</p>
                    
                    <div class="flex items-center justify-between pt-2 border-t border-slate-100 text-xs gap-2">
                        <select onchange="quickUpdateResp(${item.id}, this.value)" class="text-[11px] px-2 py-1 rounded-lg border ${respColorClass} focus:outline-none focus:ring-1 focus:ring-emerald-600 cursor-pointer">
                            <option value="Não atribuído" ${item.responsavel === 'Não atribuído' ? 'selected' : ''}>Livres / Não atribuído</option>
                            <option value="Paula" ${item.responsavel === 'Paula' ? 'selected' : ''}>Paula</option>
                            <option value="Eduardo" ${item.responsavel === 'Eduardo' ? 'selected' : ''}>Eduardo</option>
                        </select>
                        <span class="text-[11px] text-slate-400 font-medium truncate max-w-[100px]"><i class="fa-solid fa-phone mr-1 text-[9px]"></i>${item.contact || 'S/N'}</span>
                    </div>
                `;
                cols[status].appendChild(card);
            });

            document.getElementById('col-count-prospeccao').innerText = counts['Em Prospecção'];
            document.getElementById('col-count-qualificado').innerText = counts['Qualificado'];
            document.getElementById('col-count-reuniao').innerText = counts['Reunião Agendada'];
            document.getElementById('col-count-fechado').innerText = counts['Fechado'];
            
            updateCounters();
        }

        function quickUpdateResp(id, newResp) {
            const item = crmData.find(i => i.id === id);
            if (item) {
                item.responsavel = newResp;
                saveData();
            }
        }

        function allowDrop(event) {
            event.preventDefault();
            event.currentTarget.classList.add('bg-slate-300/40', 'rounded-xl');
        }

        function removeDropZone(event) {
            event.currentTarget.classList.remove('bg-slate-300/40', 'rounded-xl');
        }

        function drop(event, newStatus) {
            event.preventDefault();
            event.currentTarget.classList.remove('bg-slate-300/40', 'rounded-xl');
            
            if (draggedId !== null) {
                const item = crmData.find(i => i.id === draggedId);
                if (item) {
                    item.status = newStatus;
                    saveData();
                }
            }
        }

        function resetFilters() {
            document.getElementById('search-input').value = '';
            document.getElementById('filter-eixo').value = '';
            setRespFilter('');
        }

        function openModal() {
            document.getElementById('modal-title').innerText = 'Novo Estabelecimento';
            document.getElementById('form-id').value = '';
            document.getElementById('crm-form').reset();
            document.getElementById('modal').classList.remove('hidden');
        }

        function openEditModal(id) {
            const item = crmData.find(i => i.id === id);
            if (!item) return;

            document.getElementById('modal-title').innerText = 'Editar Estabelecimento';
            document.getElementById('form-id').value = item.id;
            document.getElementById('form-name').value = item.name;
            document.getElementById('form-eixo').value = item.eixo;
            document.getElementById('form-status').value = item.status;
            document.getElementById('form-responsavel').value = item.responsavel || 'Não atribuído';
            document.getElementById('form-cuisine').value = item.cuisine || '';
            document.getElementById('form-contact').value = item.contact || '';
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function saveItem(event) {
            event.preventDefault();
            const id = document.getElementById('form-id').value;
            const name = document.getElementById('form-name').value;
            const eixo = document.getElementById('form-eixo').value;
            const status = document.getElementById('form-status').value;
            const responsavel = document.getElementById('form-responsavel').value;
            const cuisine = document.getElementById('form-cuisine').value;
            const contact = document.getElementById('form-contact').value;

            if (id) {
                const index = crmData.findIndex(i => i.id == id);
                if (index !== -1) {
                    crmData[index] = { id: Number(id), name, eixo, status, responsavel, cuisine, contact };
                }
            } else {
                const newId = crmData.length > 0 ? Math.max(...crmData.map(i => i.id)) + 1 : 1;
                crmData.push({ id: newId, name, eixo, status, responsavel, cuisine, contact });
            }

            saveData();
            closeModal();
        }

        function deleteItem(id) {
            if (confirm('Deseja realmente excluir este estabelecimento do CRM?')) {
                crmData = crmData.filter(i => i.id !== id);
                saveData();
            }
        }

        setRespFilter('');
    </script>
</body>
</html>
