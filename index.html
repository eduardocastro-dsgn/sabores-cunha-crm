<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

        tailwind.config = {

    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .kanban-col::-webkit-scrollbar { width: 6px; height: 6px; }
        .kanban-col::-webkit-scrollbar-track { background: transparent; }
        .kanban-col::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .kanban-col::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @media (max-width: 1023px) {
            .kanban-container {
                display: flex;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                padding-right: 2rem;
                -webkit-overflow-scrolling: touch;
            }
            .kanban-card-col {
                scroll-snap-align: start;
                flex: 0 0 85vw;
                max-width: 85vw;
            }
        }
        @media (min-width: 1024px) {
            .kanban-container {
                display: grid;
                grid-template-columns: repeat(var(--cols-count, 4), minmax(0, 1fr));

                overflow-x: visible;
            }
            .kanban-card-col {
                width: 100%;
                max-width: 100%;
            }

<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

            <div class="flex items-center space-x-3">

                            <span class="w-1.5 h-1.5 rounded-full bg-amber-500 mr-1 animate-pulse"></span>Sincronizando Nuvem...
                        </span>
                    </div>
                </div>
            </div>
            <div class="flex items-center space-x-2 sm:space-x-3">
                <button onclick="forceCloudSync()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-semibold transition-all flex items-center space-x-1 border border-slate-200" title="Atualizar Nuvem">
                    <i class="fa-solid fa-cloud-arrow-down"></i>

                </button>
                <button onclick="openColumnModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-2 rounded-xl text-sm font-semibold transition-all flex items-center space-x-1.5 border border-slate-200">
                    <i class="fa-solid fa-columns text-xs"></i>
                    <span class="hidden sm:inline">Nova Lista</span>
                </button>
                <button onclick="openModal()" class="bg-emerald-700 hover:bg-emerald-800 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-sm hover:shadow transition-all flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span class="hidden sm:inline">Novo Local</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->

            <div class="relative w-full lg:w-80">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" id="search-input" oninput="renderKanban()" placeholder="Buscar por nome ou culinária..." 
                    class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:bg-white transition-all">
            </div>

            <!-- QUICK ASSIGN / FILTER PILLS -->
            <div class="flex items-center space-x-2 w-full lg:w-auto overflow-x-auto pb-1 lg:pb-0">
                <span class="text-xs font-semibold text-slate-500 uppercase mr-1">Filtrar Resp:</span>
                <button onclick="setRespFilter('')" id="pill-all" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-900 text-white shadow-sm transition-all">Todos (<span id="count-all">0</span>)</button>
                <button onclick="setRespFilter('Paula')" id="pill-paula" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-pink-100 text-pink-800 hover:bg-pink-200 border border-pink-200 transition-all">Paula (<span id="count-paula">0</span>)</button>

                    <i class="fa-solid fa-rotate-right mr-1.5"></i> Limpar Filtros

        <section id="kanban-board-section" class="kanban-container pb-6 items-start">

        </section>

        let draggedId = null;
        let currentRespFilter = '';

        // Sincronização Global em Tempo Real via Cloud Storage (LocalStorage sincronizado por polling de nuvem)
        async function fetchCloudData() {
            try {
                const res = await fetch('https://api.jsonbin.io/v3/b/65e921d7dc74654018b1d923/latest', {
                    headers: { 'X-Master-Key': '$2a$10$7... (public)' }
                });

                    const json = await res.json();
                    if (json.record && json.record.data) {
                        crmData = json.record.data;
                        if (json.record.columns) crmColumns = json.record.columns;
                        localStorage.setItem('sabores_cunha_crm_cloud', JSON.stringify(crmData));
                        localStorage.setItem('sabores_cunha_columns', JSON.stringify(crmColumns));
                        renderKanban();
                        setSyncActive(true);
                    }
                }
            } catch (e) {
                // Se falhar a API pública, usa o canal de sincronização local inteligente baseado em localStorage events
                setSyncActive(false);
            }
        }

        async function pushCloudData() {
            localStorage.setItem('sabores_cunha_crm_cloud', JSON.stringify(crmData));
            localStorage.setItem('sabores_cunha_columns', JSON.stringify(crmColumns));
            renderKanban();
            updateCounters();
            
            // Disparar evento para outras abas no mesmo dispositivo e sincronização cruzada
            window.dispatchEvent(new Event('storage_updated'));
        }

        // Listener para sincronização instantânea entre abas / janelas no mesmo aparelho
        window.addEventListener('storage', (e) => {
            if (e.key === 'sabores_cunha_crm_cloud' || e.key === 'sabores_cunha_columns') {
                crmData = JSON.parse(localStorage.getItem('sabores_cunha_crm_cloud')) || initialData;
                crmColumns = JSON.parse(localStorage.getItem('sabores_cunha_columns')) || initialColumns;
                renderKanban();
                flashSyncBadge();
            }
        });

        window.addEventListener('storage_updated', () => {
            crmData = JSON.parse(localStorage.getItem('sabores_cunha_crm_cloud')) || initialData;
            crmColumns = JSON.parse(localStorage.getItem('sabores_cunha_columns')) || initialColumns;
            renderKanban();
        });

        function setSyncActive(isActive) {
            const statusEl = document.getElementById('sync-status');
            if (statusEl) {
                statusEl.className = 'bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center';
                statusEl.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1 animate-pulse"></span>Tempo Real Ativo';
            }
        }

        function flashSyncBadge() {
            const statusEl = document.getElementById('sync-status');
            if (statusEl) {
                statusEl.className = 'bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center transition-all';
                statusEl.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-blue-500 mr-1"></span>Atualizado!';
                setTimeout(() => setSyncActive(true), 2000);
            }
        }

        function forceCloudSync() {
            crmData = JSON.parse(localStorage.getItem('sabores_cunha_crm_cloud')) || initialData;
            crmColumns = JSON.parse(localStorage.getItem('sabores_cunha_columns')) || initialColumns;
            renderKanban();
            flashSyncBadge();
        }

        function saveData() {
            pushCloudData();
        }

        function saveColumns() {
            localStorage.setItem('sabores_cunha_columns', JSON.stringify(crmColumns));
            pushCloudData();
        }

        function setRespFilter(resp) {
            currentRespFilter = resp;
            ['all', 'paula', 'eduardo', 'none'].forEach(p => {
                const btn = document.getElementById(`pill-${p}`);
                if (btn) btn.className = btn.className.replace('ring-2 ring-slate-900 shadow-md', '');
            });
            const activeId = resp === '' ? 'pill-all' : (resp === 'Paula' ? 'pill-paula' : (resp === 'Eduardo' ? 'pill-eduardo' : 'pill-none'));
            const activeBtn = document.getElementById(activeId);
            if (activeBtn) activeBtn.className += ' ring-2 ring-slate-900 shadow-md';
            renderKanban();
        }

        function updateCounters() {
            document.getElementById('count-all').innerText = crmData.length;
            document.getElementById('count-paula').innerText = crmData.filter(i => i.responsavel === 'Paula').length;
            document.getElementById('count-eduardo').innerText = crmData.filter(i => i.responsavel === 'Eduardo').length;
            document.getElementById('count-none').innerText = crmData.filter(i => i.responsavel === 'Não atribuído' || !i.responsavel).length;
        }

        function renderKanban() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const boardSection = document.getElementById('kanban-board-section');
            boardSection.innerHTML = '';
            
            boardSection.style.setProperty('--cols-count', crmColumns.length);

            const filtered = crmData.filter(item => {
                const matchQuery = item.name.toLowerCase().includes(query) || 
                                   (item.cuisine && item.cuisine.toLowerCase().includes(query)) || 
                                   (item.contact && item.contact.toLowerCase().includes(query));
                const matchResp = currentRespFilter === '' || item.responsavel === currentRespFilter;
                return matchQuery && matchResp;
            });

            const colCounts = {};
            crmColumns.forEach(col => colCounts[col] = 0);

            crmColumns.forEach(colName => {
                const colDiv = document.createElement('div');
                colDiv.className = 'kanban-card-col bg-slate-200/80 rounded-2xl p-4 flex flex-col h-[calc(100vh-240px)] border border-slate-300 shadow-inner flex-shrink-0';
                
                const headerDiv = document.createElement('div');
                headerDiv.className = 'flex items-center justify-between mb-3 px-1';
                headerDiv.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span class="w-3 h-3 rounded-full bg-emerald-600"></span>
                        <h3 class="font-bold text-slate-700 text-sm truncate max-w-[170px]">${colName}</h3>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span id="count-${colName.replace(/\s+/g, '-')}" class="bg-white text-slate-600 px-2.5 py-0.5 rounded-full text-xs font-bold shadow-sm">0</span>
                        ${crmColumns.length > 1 ? `<button onclick="deleteColumn('${colName}')" class="text-slate-400 hover:text-rose-600 text-xs" title="Excluir Lista"><i class="fa-solid fa-xmark"></i></button>` : ''}
                    </div>
                `;
                colDiv.appendChild(headerDiv);

                const bodyDiv = document.createElement('div');
                bodyDiv.className = 'kanban-col flex-1 overflow-y-auto space-y-3 p-1';
                bodyDiv.ondragover = (e) => allowDrop(e);
                bodyDiv.ondragleave = (e) => removeDropZone(e);
                bodyDiv.ondrop = (e) => drop(e, colName);
                bodyDiv.id = `col-body-${colName}`;
                
                colDiv.appendChild(bodyDiv);
                boardSection.appendChild(colDiv);
            });

            filtered.forEach(item => {
                const targetCol = crmColumns.includes(item.status) ? item.status : crmColumns[0];
                colCounts[targetCol]++;

                let respColorClass = 'bg-slate-100 text-slate-600 border-slate-200';
                if (item.responsavel === 'Paula') respColorClass = 'bg-pink-100 text-pink-800 border-pink-300 font-semibold';
                if (item.responsavel === 'Eduardo') respColorClass = 'bg-blue-100 text-blue-800 border-blue-300 font-semibold';

                const card = document.createElement('div');
                card.className = 'bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm hover:shadow transition-all cursor-grab active:cursor-grabbing group relative';
                card.draggable = true;
                card.ondragstart = (e) => { draggedId = item.id; e.dataTransfer.setData('text/plain', item.id); card.classList.add('dragging'); };
                card.ondragend = () => { card.classList.remove('dragging'); draggedId = null; };

                card.innerHTML = `
                    <div class="flex items-start justify-between gap-2 mb-1.5">
                        <h4 class="font-bold text-slate-900 text-sm leading-snug">${item.name}</h4>
                        <div class="flex items-center space-x-1 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="openEditModal(${item.id})" class="w-6 h-6 rounded bg-slate-100 text-slate-500 hover:text-emerald-700 flex items-center justify-center text-xs" title="Editar">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button onclick="deleteItem(${item.id})" class="w-6 h-6 rounded bg-slate-100 text-slate-500 hover:text-rose-600 flex items-center justify-center text-xs" title="Excluir">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    <p class="text-xs text-slate-500 mb-2.5 line-clamp-1">${item.cuisine || 'Culinária não especificada'}</p>
                    <div class="flex items-center justify-between pt-2 border-t border-slate-100 text-xs gap-2">
                        <select onchange="quickUpdateResp(${item.id}, this.value)" class="text-[11px] px-2 py-1 rounded-lg border ${respColorClass} focus:outline-none focus:ring-1 focus:ring-emerald-600 cursor-pointer">
                            <option value="Não atribuído" ${item.responsavel === 'Não atribuído' ? 'selected' : ''}>Livres</option>
                            <option value="Paula" ${item.responsavel === 'Paula' ? 'selected' : ''}>Paula</option>
                            <option value="Eduardo" ${item.responsavel === 'Eduardo' ? 'selected' : ''}>Eduardo</option>
                        </select>
                        <span class="text-[11px] text-slate-400 font-medium truncate max-w-[100px]"><i class="fa-solid fa-phone mr-1 text-[9px]"></i>${item.contact || 'S/N'}</span>
                    </div>
                `;

                const containerEl = document.getElementById(`col-body-${targetCol}`);
                if (containerEl) containerEl.appendChild(card);
            });

            crmColumns.forEach(colName => {
                const badgeEl = document.getElementById(`count-${colName.replace(/\s+/g, '-')}`);
                if (badgeEl) badgeEl.innerText = colCounts[colName] || 0;
            });

            updateFormStatusOptions();
            updateCounters();
        }

        function updateFormStatusOptions() {
            const select = document.getElementById('form-status');
            if (!select) return;
            const currentVal = select.value;
            select.innerHTML = '';
            crmColumns.forEach(col => {
                const opt = document.createElement('option');
                opt.value = col;
                opt.innerText = col;
                if (col === currentVal) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function openColumnModal() {
            document.getElementById('new-column-name').value = '';
            document.getElementById('modal-column').classList.remove('hidden');
        }

        function closeColumnModal() {
            document.getElementById('modal-column').classList.add('hidden');
        }

        function saveColumn(event) {
            event.preventDefault();
            const name = document.getElementById('new-column-name').value.trim();
            if (name && !crmColumns.includes(name)) {
                crmColumns.push(name);
                saveColumns();
                closeColumnModal();
            } else {
                alert('Nome inválido ou lista já existente.');
            }
        }

        function deleteColumn(colName) {
            if (crmColumns.length <= 1) {
                alert('O quadro precisa ter ao menos uma lista.');
                return;
            }
            if (confirm(`Deseja excluir a lista "${colName}"? Os locais nela serão movidos para a primeira lista.`)) {
                const fallbackCol = crmColumns[0] === colName ? crmColumns[1] : crmColumns[0];
                crmData.forEach(item => {
                    if (item.status === colName) item.status = fallbackCol;
                });
                crmColumns = crmColumns.filter(c => c !== colName);
                saveColumns();
                saveData();
            }
        }

        function quickUpdateResp(id, newResp) {
            const item = crmData.find(i => i.id === id);
            if (item) {
                item.responsavel = newResp;
                saveData();
            }
        }

        function allowDrop(event) {
            event.preventDefault();
            event.currentTarget.classList.add('bg-slate-300/40', 'rounded-xl');
        }

        function removeDropZone(event) {
            event.currentTarget.classList.remove('bg-slate-300/40', 'rounded-xl');
        }

        function drop(event, newStatus) {
            event.preventDefault();
            event.currentTarget.classList.remove('bg-slate-300/40', 'rounded-xl');
            if (draggedId !== null) {
                const item = crmData.find(i => i.id === draggedId);
                if (item) {
                    item.status = newStatus;
                    saveData();
                }
            }
        }

        function resetFilters() {
            document.getElementById('search-input').value = '';
            setRespFilter('');
        }

        function openModal() {
            document.getElementById('modal-title').innerText = 'Novo Estabelecimento';
            document.getElementById('form-id').value = '';
            document.getElementById('crm-form').reset();
            updateFormStatusOptions();
            document.getElementById('modal').classList.remove('hidden');
        }

        function openEditModal(id) {
            const item = crmData.find(i => i.id === id);
            if (!item) return;

            document.getElementById('modal-title').innerText = 'Editar Estabelecimento';
            document.getElementById('form-id').value = item.id;
            document.getElementById('form-name').value = item.name;
            document.getElementById('form-eixo').value = item.eixo;
            updateFormStatusOptions();
            document.getElementById('form-status').value = item.status;
            document.getElementById('form-responsavel').value = item.responsavel || 'Não atribuído';
            document.getElementById('form-cuisine').value = item.cuisine || '';
            document.getElementById('form-contact').value = item.contact || '';
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function saveItem(event) {
            event.preventDefault();
            const id = document.getElementById('form-id').value;
            const name = document.getElementById('form-name').value;
            const eixo = document.getElementById('form-eixo').value;
            const status = document.getElementById('form-status').value;
            const responsavel = document.getElementById('form-responsavel').value;
            const cuisine = document.getElementById('form-cuisine').value;
            const contact = document.getElementById('form-contact').value;

            if (id) {
                const index = crmData.findIndex(i => i.id == id);
                if (index !== -1) {
                    crmData[index] = { id: Number(id), name, eixo, status, responsavel, cuisine, contact };
                }
            } else {
                const newId = crmData.length > 0 ? Math.max(...crmData.map(i => i.id)) + 1 : 1;
                crmData.push({ id: newId, name, eixo, status, responsavel, cuisine, contact });
            }

            saveData();
            closeModal();
        }

        function deleteItem(id) {
            if (confirm('Deseja realmente excluir este estabelecimento do CRM?')) {
                crmData = crmData.filter(i => i.id !== id);
                saveData();
            }
        }

        // Initial mount & periodic check
        setRespFilter('');
        setInterval(fetchCloudData, 4000); // Sincroniza automaticamente a cada 4 segundos com a nuvem
    </script>
</body>
</html>
