<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabores de Cunha - Prospecção</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        function openProposalModal() {
            const modal = document.getElementById('modal-proposal');
            if (modal) {
                modal.classList.remove('hidden');
            } else {
                alert('Modal de proposta não encontrado.');
            }
        }
        function closeProposalModal() {
            const modal = document.getElementById('modal-proposal');
            if (modal) {
                modal.classList.add('hidden');
            }
        }
        function copyProposalText() {
            const text = "Movimento Sabores de Cunha
- Propósito: Unificar a gastronomia de Cunha como um destino único.
- Os 4 Pilares: Comunidade, Experiências, Comunicação e Desenvolvimento.
- Investimento de Adesão: R$ 300/mês para construção coletiva da rede.
- Convite: Estamos procurando parceiros que acreditam no futuro da gastronomia local.";
            navigator.clipboard.writeText(text);
            alert('Resumo oficial da proposta copiado para a área de transferência!');
        }
    </script>
</body>

</html>
